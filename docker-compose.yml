services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: novelscript-ai-backend:latest
    restart: unless-stopped
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      APP_ENV: production
      PORT: 8080
      API_BASE_PATH: /api/v1
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}
      REQUEST_BODY_LIMIT_MB: ${REQUEST_BODY_LIMIT_MB:-20}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost}
      DATA_DIR: /app/data
      EXPORT_DIR: /app/data/exports
      SCRIPT_SCHEMA_PATH: /app/schemas/script.schema.json
    volumes:
      - backend-data:/app/data
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: novelscript-ai-frontend:latest
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-80}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  backend-data:
